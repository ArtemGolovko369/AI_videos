<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Было тяжело — сниппет</title>
<link rel="stylesheet" href="fonts/nunito.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #070a1c; }
  body { font-family: 'Nunito', sans-serif; color: #fff; }
  #stage { position: absolute; inset: 0; transform-origin: 480px 1050px; }
  #bg { position: absolute; inset: 0; }
  #vign { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 60% at 50% 48%, rgba(0,0,0,0) 40%, rgba(0,0,0,.6) 100%); }
  #streaks, #dust, #fx { position: absolute; inset: 0; }
  .streak { position: absolute; height: 14px; border-radius: 10px; filter: blur(10px); }

  /* lyrics */
  #lyr { position: absolute; left: 40px; width: 880px; top: 210px; height: 400px;
         display: flex; align-items: center; justify-content: center; text-align: center; }
  #line { font-weight: 900; line-height: 1.12; letter-spacing: -1px; }
  .w { display: inline-block; margin: 0 14px; transform-origin: 50% 70%; white-space: nowrap; }

  /* card */
  #cardwrap { position: absolute; left: 80px; top: 690px; width: 800px; height: 760px; perspective: 1600px; }
  #glow { position: absolute; left: 60px; right: 60px; bottom: -40px; height: 160px; border-radius: 50%; filter: blur(60px); }
  #card { position: absolute; inset: 0; border-radius: 64px;
          background: linear-gradient(160deg, rgba(255,255,255,.24), rgba(255,255,255,.08));
          border: 2px solid rgba(255,255,255,.38);
          box-shadow: 0 50px 120px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.35);
          backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
          padding: 48px 52px; overflow: hidden; }
  .hdr { display: flex; align-items: center; gap: 26px; }
  .appic { width: 104px; height: 104px; border-radius: 30px; display: flex; align-items: center; justify-content: center;
           box-shadow: 0 10px 30px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.4); flex: none; }
  .ttl { font-size: 58px; font-weight: 900; line-height: 1; }
  .sub { font-size: 34px; font-weight: 700; opacity: .7; margin-top: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 14px; padding: 14px 30px; border-radius: 999px;
          font-size: 36px; font-weight: 900; white-space: nowrap; }
  .abs { position: absolute; }
  .notif { position: absolute; left: 34px; right: 34px; border-radius: 40px; background: rgba(255,255,255,.2);
           border: 2px solid rgba(255,255,255,.3); padding: 26px 30px; box-shadow: 0 20px 40px rgba(0,0,0,.25); }
  .nh { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 800; opacity: .8; }
  .nb { font-size: 40px; font-weight: 800; margin-top: 10px; line-height: 1.15; }
  .btn { flex: 1; height: 92px; border-radius: 28px; display: flex; align-items: center; justify-content: center; gap: 12px;
         font-size: 38px; font-weight: 900; }
  .row { display: flex; align-items: center; justify-content: space-between; height: 128px; padding: 0 30px; border-radius: 36px; margin-top: 18px;
         background: rgba(255,255,255,.12); font-size: 46px; font-weight: 800; }
  .tg { width: 150px; height: 84px; border-radius: 50px; position: relative; flex: none; }
  .tg i { position: absolute; top: 7px; width: 70px; height: 70px; border-radius: 50%; background: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
  .chip { padding: 16px 26px; border-radius: 26px; background: rgba(255,255,255,.18); font-size: 32px; font-weight: 800; white-space: nowrap; }

  #scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.12) 0 2px, rgba(0,0,0,0) 2px 6px); mix-blend-mode: overlay; }
  #flash { position: absolute; inset: 0; background: #fff; }
  #fade { position: absolute; inset: 0; background: #05060f; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="streaks"></div>
  <svg id="dust" width="1080" height="1920"></svg>
  <div id="vign"></div>
  <div id="cardwrap"><div id="glow"></div><div id="card"></div></div>
  <svg id="fx" width="1080" height="1920"></svg>
  <div id="lyr"><div id="line"></div></div>
</div>
<div id="scan"></div>
<div id="flash"></div>
<div id="fade"></div>

<script>
// ---------- utils ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const smooth = (a, b, t) => { const x = prog(t, a, b); return x * x * (3 - 2 * x); };
// spring from 'from' to 1
const spring = (x, from = 0.6, k = 9, w = 17) => x <= 0 ? from : 1 - (1 - from) * Math.exp(-k * x) * Math.cos(w * x);
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => rng(n * 9973 + 17)();
function mixHex(a, b, x) {
  const pa = a.match(/\w\w/g).map(h => parseInt(h, 16)), pb = b.match(/\w\w/g).map(h => parseInt(h, 16));
  return 'rgb(' + pa.map((v, i) => Math.round(lerp(v, pb[i], x))).join(',') + ')';
}
const $ = id => document.getElementById(id);

// ---------- timing ----------
const LINES = [
  { s: 0.48, w: [['Было', .48, .85], ['тяжело', .90, 2.20, 'acc']] },
  { s: 2.24, w: [['Да', 2.24, 2.50], ['я', 2.55, 2.72], ['знаю', 2.75, 3.55, 'acc']] },
  { s: 3.60, w: [['Было', 3.60, 3.92], ['не', 3.95, 4.12], ['легко', 4.15, 4.80, 'acc']] },
  { s: 4.83, w: [['Понимаю', 4.83, 5.60], ['но', 5.70, 6.15], ['я', 6.20, 6.88, 'dyn']] },
  { s: 6.92, w: [['Нашел', 6.92, 7.50, 'in'], ['свой', 7.55, 8.15, 'in'], ['путь', 8.20, 9.40, 'dyn']] },
  { s: 9.45, w: [['Свою', 9.45, 9.95, 'in'], ['дорогу', 10.00, 11.60, 'dyn']] },
  { s: 11.65, w: [['Жизни', 11.65, 12.02, 'in'], ['своей', 12.05, 12.40, 'in'], ['суть', 12.45, 13.70, 'big']] },
];
// scene boundaries (cut slightly before line start, on the beat)
const B = [0, 2.16, 3.52, 4.75, 6.84, 9.37, 11.57, 99];
const TR = [null, 'glitch', 'pop', 'glitch', 'glitch', 'swipe', 'glitch'];
const sceneAt = t => { for (let i = 0; i < 7; i++) if (t < B[i + 1]) return i; return 6; };

// ---------- svg icons ----------
const heart = (c, s = 1) => `<path transform="scale(${s})" d="M0 12 C-30 -10 -22 -36 0 -22 C22 -36 30 -10 0 12 Z" fill="${c}"/>`;
const star = (c, s = 1) => `<path transform="scale(${s})" d="M0 -26 L7 -8 L26 -8 L11 4 L17 23 L0 12 L-17 23 L-11 4 L-26 -8 L-7 -8 Z" fill="${c}"/>`;
const spark = (c, s = 1) => `<path transform="scale(${s})" d="M0 -24 Q3 -3 24 0 Q3 3 0 24 Q-3 3 -24 0 Q-3 -3 0 -24Z" fill="${c}"/>`;
const drop = (c, s = 1) => `<path transform="scale(${s})" d="M0 -24 C10 -8 16 2 16 10 A16 16 0 0 1 -16 10 C-16 2 -10 -8 0 -24Z" fill="${c}"/>`;
function face(kind, s = 1) {
  let eyes, mouth, extra = '';
  if (kind === 'tired') {
    eyes = `<path d="M-15 -8 l9 5 l-9 5 M15 -8 l-9 5 l9 5" stroke="#5a3a00" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    mouth = `<path d="M-10 16 Q0 6 10 16" stroke="#5a3a00" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    extra = `<path d="M20 -26 C24 -18 27 -14 27 -10 A7 7 0 0 1 13 -10 C13 -14 16 -18 20 -26Z" fill="#7dd3fc"/>`;
  } else if (kind === 'happy') {
    eyes = `<path d="M-17 -2 q6 -9 12 0 M5 -2 q6 -9 12 0" stroke="#5a3a00" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    mouth = `<path d="M-13 8 Q0 24 13 8 Z" fill="#5a3a00"/>`;
    extra = `<circle cx="-20" cy="9" r="5" fill="#fb7185" opacity=".6"/><circle cx="20" cy="9" r="5" fill="#fb7185" opacity=".6"/>`;
  } else { // shocked
    eyes = `<circle cx="-10" cy="-5" r="5" fill="#5a3a00"/><circle cx="10" cy="-5" r="5" fill="#5a3a00"/>`;
    mouth = `<ellipse cx="0" cy="14" rx="6" ry="8" fill="#5a3a00"/>`;
  }
  return `<g transform="scale(${s})"><circle r="30" fill="#FFD54A"/><circle r="30" fill="none" stroke="#f5a524" stroke-width="3"/>${eyes}${mouth}${extra}</g>`;
}
const check = (c = '#fff', s = 1) => `<path transform="scale(${s})" d="M-14 0 L-4 10 L15 -11" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
const svgI = (inner, w = 64, h = 64) => `<svg width="${w}" height="${h}" viewBox="${-w / 2} ${-h / 2} ${w} ${h}" style="overflow:visible">${inner}</svg>`;

// ---------- static decorations ----------
(function initStatic() {
  let h = '';
  const cols = ['rgba(120,220,255,.35)', 'rgba(255,160,120,.3)', 'rgba(200,140,255,.3)'];
  for (let i = 0; i < 4; i++) h += `<div class="streak" id="st${i}" style="width:${500 + i * 120}px;background:${cols[i % 3]}"></div>`;
  $('streaks').innerHTML = h;
})();
const DUST = Array.from({ length: 70 }, (_, i) => { const r = rng(i + 1); return { x: r() * 1080, y: r() * 1920, s: 1.5 + r() * 3.5, v: 20 + r() * 50, ph: r() * 6.28, a: .25 + r() * .5 }; });

// floating reactions: [t0, x, type, dur]
const FLOATERS = [
  [0.2, 120, 'tired', 2.4], [0.9, 820, 'drop', 2.2], [1.3, 150, 'drop', 2.0], [1.7, 860, 'tired', 2.2],
  [2.5, 830, 'shocked', 2.0], [2.9, 130, 'drop', 2.0],
  [3.7, 150, 'tired', 2.2], [4.2, 840, 'drop', 2.0],
  [6.25, 140, 'spark', 2.0], [6.3, 830, 'happy', 2.4], [6.6, 850, 'heart', 2.2],
  [7.4, 120, 'heart', 2.4], [8.25, 840, 'star', 2.2], [8.4, 150, 'happy', 2.4], [8.9, 860, 'heart', 2.2],
  [9.6, 130, 'spark', 2.0], [10.05, 850, 'heart', 2.4], [10.5, 140, 'star', 2.2], [11.0, 830, 'happy', 2.4],
  [11.8, 140, 'heart', 2.0], [12.1, 840, 'spark', 2.0],
];
function floaterSvg(type) {
  switch (type) {
    case 'heart': return heart('#ff4d7d', 1.6);
    case 'star': return star('#ffd54a', 1.5);
    case 'spark': return spark('#9ef0ff', 1.6);
    case 'drop': return drop('#7dd3fc', 1.4);
    default: return face(type, 1.4);
  }
}
// finale burst particles
const BURST = Array.from({ length: 46 }, (_, i) => { const r = rng(500 + i);
  return { a: r() * Math.PI * 2, v: 500 + r() * 900, rot: (r() - .5) * 720, s: .7 + r() * 1.1,
    type: ['heart', 'star', 'spark', 'heart', 'conf'][i % 5], c: ['#ff4d7d', '#ffd54a', '#34d399', '#60a5fa', '#f472b6'][i % 5] }; });

// ---------- scenes ----------
function S1(t) { // нагрузка
  let p = t < .9 ? lerp(35, 64, easeOut(prog(t, 0, .9))) : lerp(64, 187, easeOut(prog(t, .9, 1.7)));
  const col = p < 70 ? '#34D399' : p < 100 ? '#FBBF24' : '#F43F5E';
  const w = clamp(p / 200) * 100;
  const sh = p > 100 ? (hash(Math.round(t * 30)) - .5) * 14 * (1 - prog(t, 1.7, 2.1) * .6) : 0;
  const bs = spring(t - 1.45, 0, 10, 16);
  const kb = `<circle cx="0" cy="8" r="24" fill="#fff"/><path d="M-14 -10 a14 14 0 0 1 28 0" stroke="#fff" stroke-width="8" fill="none"/>`;
  return `
  <div class="hdr"><div class="appic" style="background:linear-gradient(140deg,#fb923c,#f43f5e)">${svgI(kb, 70, 70)}</div>
    <div><div class="ttl">нагрузка</div><div class="sub">сегодня · уровень жизни</div></div></div>
  <div style="transform:translateX(${sh}px)">
    <div style="font-size:210px;font-weight:900;line-height:1;margin-top:46px;color:${col};text-shadow:0 0 40px ${col}88">${Math.round(p)}<span style="font-size:110px">%</span></div>
    <div style="position:relative;height:64px;border-radius:40px;background:rgba(255,255,255,.18);margin-top:30px;overflow:hidden">
      <div style="position:absolute;left:0;top:0;bottom:0;width:${w}%;border-radius:40px;background:linear-gradient(90deg,#34D399,#FBBF24 50%,#F43F5E);box-shadow:0 0 30px ${col}"></div>
      <div style="position:absolute;left:50%;top:-6px;bottom:-6px;width:5px;background:#fff;opacity:.9"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:32px;font-weight:800;opacity:.75;margin-top:16px"><span>0</span><span style="margin-left:60px">норма</span><span>200</span></div>
  </div>
  <div class="pill abs" style="left:52px;bottom:52px;background:#F43F5E;box-shadow:0 0 40px #F43F5Eaa;transform:scale(${bs}) rotate(-4deg);opacity:${t > 1.45 ? 1 : 0}">
    ${svgI(`<path d="M0 -20 L22 18 L-22 18 Z" fill="#fff"/><rect x="-3" y="-6" width="6" height="13" rx="3" fill="#F43F5E"/><circle cy="12" r="3.5" fill="#F43F5E"/>`, 50, 50)} перегруз</div>`;
}

function S2(t) { // уведомления
  const n = (t0, top, inner, extra = '') => {
    const x = t - t0; const y = x <= 0 ? -260 : lerp(-260, 0, spring(x, 0, 9, 14));
    return `<div class="notif" style="top:${top}px;transform:translateY(${y}px);opacity:${clamp(x * 6)};${extra}">${inner}</div>`;
  };
  const ic = (bg, inner) => `<div style="width:54px;height:54px;border-radius:16px;background:${bg};display:flex;align-items:center;justify-content:center">${inner}</div>`;
  const ex = svgI(`<rect x="-4" y="-16" width="8" height="20" rx="4" fill="#fff"/><circle cy="12" r="4.5" fill="#fff"/>`, 40, 40);
  const tap = t - 2.75, pressed = tap > 0;
  const bsc = tap < 0 ? 1 : tap < .12 ? lerp(1, .9, tap / .12) : spring(tap - .12, .9, 10, 18);
  const rip = pressed ? clamp(tap / .5) : 0;
  return `
  ${n(2.16, 40, `<div class="nh">${ic('#f43f5e', ex)} ЖИЗНЬ · сейчас</div><div class="nb">уровень сложности: максимальный</div>`, 'opacity:.75')}
  ${n(2.36, 230, `<div class="nh">${ic('#f59e0b', ex)} ЖИЗНЬ · сейчас</div><div class="nb">у тебя 99+ новых проблем</div>`, 'opacity:.85')}
  ${n(2.52, 420, `<div class="nh">${ic('#6366f1', ex)} СИСТЕМА · сейчас</div><div class="nb">ты точно в курсе?</div>
     <div style="display:flex;gap:20px;margin-top:22px">
       <div class="btn" style="background:rgba(255,255,255,.18)">подробнее</div>
       <div class="btn" style="position:relative;overflow:hidden;transform:scale(${bsc});background:${pressed ? '#22c55e' : 'rgba(255,255,255,.3)'};box-shadow:${pressed ? '0 0 40px #22c55eaa' : 'none'}">
         <div style="position:absolute;width:${rip * 600}px;height:${rip * 600}px;border-radius:50%;background:rgba(255,255,255,${.5 * (1 - rip)})"></div>
         ${pressed ? svgI(check('#fff', 1.1), 44, 44) : ''}да, я знаю</div>
     </div>`)}`;
}

function S3(t) { // батарея
  let lvl = t < 4.15 ? lerp(64, 22, easeInOut(prog(t, 3.55, 4.15))) : lerp(22, 1, easeOut(prog(t, 4.15, 4.45)));
  const low = lvl < 10, col = lvl > 40 ? '#34D399' : lvl > 15 ? '#FBBF24' : '#F43F5E';
  const blink = low ? (Math.sin(t * 22) > 0 ? 1 : .35) : 1;
  const ps = spring(t - 4.3, 0, 10, 16);
  const bolt = `<path d="M6 -26 L-14 4 L0 4 L-6 26 L14 -6 L0 -6 Z" fill="#fff"/>`;
  return `
  <div class="hdr"><div class="appic" style="background:linear-gradient(140deg,#34d399,#0ea5e9)">${svgI(bolt, 70, 70)}</div>
    <div><div class="ttl">заряд сил</div><div class="sub">аккумулятор · ты</div></div></div>
  <div style="position:relative;margin:70px auto 0;width:600px;height:270px">
    <div style="position:absolute;left:0;top:0;width:560px;height:270px;border-radius:56px;border:12px solid rgba(255,255,255,.9)"></div>
    <div style="position:absolute;left:570px;top:85px;width:30px;height:100px;border-radius:0 18px 18px 0;background:rgba(255,255,255,.9)"></div>
    <div style="position:absolute;left:26px;top:26px;height:218px;width:${Math.max(16, 508 * lvl / 100)}px;border-radius:32px;background:${col};box-shadow:0 0 40px ${col};opacity:${blink}"></div>
    <div style="position:absolute;left:0;width:560px;top:0;height:270px;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:900;text-shadow:0 4px 20px rgba(0,0,0,.4)">${Math.round(lvl)}%</div>
  </div>
  <div class="pill abs" style="left:50%;bottom:58px;transform:translateX(-50%) scale(${ps});background:#FBBF24;color:#3b2500;opacity:${t > 4.3 ? 1 : 0}">режим энергосбережения</div>`;
}

function S4(t) { // настройки
  const tog = (on, col = '#34D399') => `<div class="tg" style="background:${mixHex('5a6178', col.slice(1), on)};box-shadow:${on > .5 ? `0 0 30px ${col}99` : 'none'}"><i style="left:${lerp(7, 73, on)}px"></i></div>`;
  const give = 1 - easeOut(prog(t, 5.72, 5.9));
  const go = easeOut(prog(t, 6.2, 6.38));
  const dv = lerp(88, 12, easeInOut(prog(t, 4.95, 6.15)));
  const glow = go;
  const st = spring(t - 6.4, 0, 9, 15);
  const gear = `<circle r="16" fill="none" stroke="#fff" stroke-width="9"/>` + Array.from({ length: 8 }, (_, i) => `<rect x="-5" y="-30" width="10" height="12" rx="3" fill="#fff" transform="rotate(${i * 45 + t * 40})"/>`).join('');
  return `
  <div class="hdr"><div class="appic" style="background:linear-gradient(140deg,#94a3b8,#475569)">${svgI(gear, 70, 70)}</div>
    <div><div class="ttl">настройки</div><div class="sub">жизнь · основные</div></div></div>
  <div style="margin-top:34px">
    <div class="row"><span>сдаться</span>${tog(give)}</div>
    <div class="row" style="display:block;height:150px;padding-top:22px"><div style="display:flex;justify-content:space-between"><span>сомнения</span><span style="opacity:.7">${Math.round(dv)}%</span></div>
      <div style="position:relative;height:20px;border-radius:10px;background:rgba(255,255,255,.2);margin-top:22px">
        <div style="position:absolute;left:0;top:0;bottom:0;width:${dv}%;border-radius:10px;background:#a78bfa"></div>
        <div style="position:absolute;top:-14px;left:calc(${dv}% - 24px);width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3)"></div></div></div>
    <div class="row" style="background:rgba(52,211,153,${.12 + .25 * glow});box-shadow:0 0 ${60 * glow}px rgba(52,211,153,${.6 * glow})"><span>идти дальше</span>${tog(go)}</div>
  </div>
  <div class="pill abs" style="right:40px;top:40px;background:#ff4d7d;transform:rotate(8deg) scale(${st});opacity:${t > 6.4 ? 1 : 0};font-size:40px;box-shadow:0 0 40px #ff4d7daa">погнали!</div>`;
}

// route bezier
const bz = (p0, p1, p2, u) => [(1 - u) ** 2 * p0[0] + 2 * (1 - u) * u * p1[0] + u * u * p2[0], (1 - u) ** 2 * p0[1] + 2 * (1 - u) * u * p1[1] + u * u * p2[1]];
const STREETS = Array.from({ length: 16 }, (_, i) => { const r = rng(300 + i); return i < 8 ? `M${r() * 700} -10 L${r() * 700} 430` : `M-10 ${r() * 420} L710 ${r() * 420}`; }).join(' ');
function S5(t) { // маршрут
  const A = [80, 350], C = [300, -60], Z = [620, 90];
  const u = easeInOut(prog(t, 6.95, 9.1));
  const [px, py] = bz(A, C, Z, u), [qx, qy] = bz(A, C, Z, Math.min(1, u + .01));
  const ang = Math.atan2(qy - py, qx - px) * 180 / Math.PI;
  const found = t > 8.2, bs = spring(t - 8.2, 0, 10, 16);
  const km = Math.round(u * 12480).toLocaleString('ru-RU');
  const trail = Array.from({ length: 40 }, (_, i) => bz(A, C, Z, u * i / 39)).map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const plane = `<path d="M26 0 L-14 -8 L-22 -26 L-30 -26 L-24 -6 L-34 -4 L-40 -14 L-46 -14 L-42 0 L-46 14 L-40 14 L-34 4 L-24 6 L-30 26 L-22 26 L-14 8 Z" fill="#fff"/>`;
  const pin = (x, y, c, s) => `<g transform="translate(${x},${y}) scale(${s})"><path d="M0 0 C-16 -22 -26 -32 -26 -46 A26 26 0 0 1 26 -46 C26 -32 16 -22 0 0Z" fill="${c}"/><circle cy="-46" r="10" fill="#fff"/></g>`;
  return `
  <div class="hdr"><div class="appic" style="background:linear-gradient(140deg,#22d3ee,#3b82f6)">${svgI(`<path d="M0 -28 L22 24 L0 12 L-22 24 Z" fill="#fff"/>`, 70, 70)}</div>
    <div><div class="ttl">маршрут</div><div class="sub">откуда: «тяжело» → куда: к себе</div></div></div>
  <div style="position:relative;margin-top:30px;height:430px;border-radius:40px;overflow:hidden;background:linear-gradient(160deg,#0f3b4d,#123a63)">
    <svg width="696" height="430" style="position:absolute;left:0;top:0">
      <path d="${STREETS}" stroke="rgba(255,255,255,.08)" stroke-width="10" fill="none"/>
      <path d="M${A} Q${C} ${Z}" stroke="rgba(255,255,255,.55)" stroke-width="7" stroke-dasharray="4 22" stroke-linecap="round" fill="none"/>
      <path d="${trail}" stroke="${found ? '#34D399' : '#38bdf8'}" stroke-width="10" stroke-linecap="round" fill="none" style="filter:drop-shadow(0 0 10px ${found ? '#34D399' : '#38bdf8'})"/>
      ${pin(A[0], A[1] + 10, '#F43F5E', 1)}
      ${pin(Z[0], Z[1] + 10, '#34D399', 1 + (found ? .25 * Math.exp(-5 * (t - 8.2)) * Math.sin(20 * (t - 8.2)) : 0))}
      <g transform="translate(${px},${py}) rotate(${ang}) scale(1.3)">${plane}</g>
    </svg>
    <div class="pill abs" style="left:50%;bottom:26px;transform:translateX(-50%) scale(${bs});background:#22c55e;opacity:${found ? 1 : 0};box-shadow:0 0 40px #22c55eaa">${svgI(check('#fff', 1), 44, 44)}маршрут найден</div>
  </div>
  <div style="display:flex;justify-content:space-between;margin-top:30px;font-size:31px;font-weight:800">
    <span><span style="opacity:.65">пройдено </span>${km} км</span><span><span style="opacity:.65">в пути: </span>всю жизнь</span></div>`;
}

// road cubic
const cb = (p, u) => { const v = 1 - u; return [0, 1].map(k => v ** 3 * p[0][k] + 3 * v * v * u * p[1][k] + 3 * v * u * u * p[2][k] + u ** 3 * p[3][k]); };
const ROAD = [[40, 400], [760, 400], [-60, 40], [660, 30]];
const ROADPTS = Array.from({ length: 121 }, (_, i) => cb(ROAD, i / 120));
const ROADLEN = ROADPTS.reduce((s, p, i) => i ? s + Math.hypot(p[0] - ROADPTS[i - 1][0], p[1] - ROADPTS[i - 1][1]) : 0, 0);
const ROADD = `M${ROAD[0]} C${ROAD[1]} ${ROAD[2]} ${ROAD[3]}`;
function S6(t) { // дорога
  const rev = easeOut(prog(t, 9.45, 10.35));
  const u = easeInOut(prog(t, 10.0, 11.55));
  const [cx, cy] = cb(ROAD, u), [dx, dy] = cb(ROAD, Math.min(1, u + .01));
  const ang = Math.atan2(dy - cy, dx - cx) * 180 / Math.PI;
  const car = `<rect x="-34" y="-20" width="68" height="40" rx="14" fill="#ff5a5f"/><rect x="2" y="-15" width="16" height="30" rx="5" fill="#bfe9ff"/>
    <rect x="-24" y="-13" width="20" height="26" rx="6" fill="#7a1f2b"/><circle cx="-14" cy="0" r="5" fill="#ffd54a"/>
    <rect x="30" y="-17" width="6" height="9" rx="2" fill="#fff8b0"/><rect x="30" y="8" width="6" height="9" rx="2" fill="#fff8b0"/>`;
  const PINS = [[.25, '#ff4d7d', 'h'], [.5, '#ffd54a', 's'], [.75, '#34d399', 'h']];
  const pins = PINS.map(([pu, c, k], i) => { const [x, y] = cb(ROAD, pu); const sc = u >= pu - .02 ? spring(t - (10.0 + (pu - .02) * 1.55 + .1), 0, 10, 16) : 0;
    return `<g transform="translate(${x},${y - 46}) scale(${sc})"><circle r="30" fill="${c}"/>${k === 'h' ? heart('#fff', .8) : star('#fff', .75)}</g>`; }).join('');
  const chip = (txt, t0) => `<div class="chip" style="transform:scale(${spring(t - t0, 0, 10, 16)});opacity:${t > t0 ? 1 : 0}">${txt}</div>`;
  return `
  <div class="hdr"><div class="appic" style="background:linear-gradient(140deg,#fbbf24,#f97316)">${svgI(`<path d="M-8 -28 L8 -28 L20 28 L-20 28Z" fill="#fff"/><rect x="-3" y="-20" width="6" height="10" fill="#f97316"/><rect x="-3" y="-2" width="6" height="10" fill="#f97316"/><rect x="-3" y="16" width="6" height="10" fill="#f97316"/>`, 70, 70)}</div>
    <div><div class="ttl">моя дорога</div><div class="sub">навигатор · без пробок</div></div></div>
  <div style="position:relative;margin-top:26px;height:440px;border-radius:40px;overflow:hidden;background:linear-gradient(180deg,#1d6b5a,#2f8f5b)">
    <svg width="696" height="440" style="position:absolute;left:0;top:0">
      ${Array.from({ length: 14 }, (_, i) => { const r = rng(700 + i); return `<circle cx="${r() * 696}" cy="${r() * 440}" r="${10 + r() * 22}" fill="rgba(20,70,40,.55)"/>`; }).join('')}
      <path d="${ROADD}" stroke="#3a3f4b" stroke-width="58" fill="none" stroke-linecap="round" stroke-dasharray="${ROADLEN}" stroke-dashoffset="${ROADLEN * (1 - rev)}"/>
      <path d="${ROADD}" stroke="#ffffff" stroke-width="6" fill="none" stroke-dasharray="22 22" opacity="${rev > .98 ? .9 : 0}"/>
      ${pins}
      <g transform="translate(${cx},${cy}) rotate(${ang}) scale(1.1)" opacity="${t > 9.9 ? 1 : 0}">${car}</g>
    </svg>
  </div>
  <div style="display:flex;gap:16px;margin-top:26px;justify-content:center">${chip('пробки: 0', 10.05)}${chip('развороты: 0', 10.4)}${chip('скорость: своя', 10.8)}</div>`;
}

function S7(t) { // поиск смысла
  const p = easeInOut(prog(t, 11.62, 12.45));
  const done = t >= 12.45, x = t - 12.45;
  const R = 160, L = 2 * Math.PI * R;
  const col = done ? '#34D399' : '#60a5fa';
  const hs = done ? spring(x, 0, 8, 14) : 0;
  const beat = done ? 1 + .06 * Math.max(0, Math.sin(x * 9)) * Math.exp(-x * .6) : 1;
  return `
  <div class="hdr"><div class="appic" style="background:linear-gradient(140deg,#f472b6,#a855f7)">${svgI(`<circle cx="-4" cy="-4" r="16" fill="none" stroke="#fff" stroke-width="8"/><path d="M8 8 L22 22" stroke="#fff" stroke-width="9" stroke-linecap="round"/>`, 70, 70)}</div>
    <div><div class="ttl">${done ? 'найдено' : 'поиск смысла…'}</div><div class="sub">запрос: «жизнь»</div></div></div>
  <div style="position:relative;margin:34px auto 0;width:420px;height:420px">
    <svg width="420" height="420" viewBox="-210 -210 420 420" style="position:absolute;inset:0;overflow:visible">
      <circle r="${R}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="30"/>
      <circle r="${R}" fill="none" stroke="${col}" stroke-width="30" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L * (1 - p)}" transform="rotate(-90)" style="filter:drop-shadow(0 0 14px ${col})"/>
      ${done ? `<g transform="scale(${hs * 3.6 * beat}) translate(0,4)" style="filter:drop-shadow(0 0 8px #ff4d7d)">${heart('#ff4d7d', 1)}</g>` : ''}
    </svg>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:900;opacity:${done ? 1 - clamp(x * 8) : 1}">${Math.round(p * 100)}%</div>
  </div>
  <div class="pill abs" style="left:50%;bottom:44px;transform:translateX(-50%) scale(${done ? spring(x - .15, 0, 10, 16) : 0});background:#22c55e;box-shadow:0 0 40px #22c55eaa">${svgI(check('#fff', 1), 44, 44)}смысл найден</div>`;
}
const SCENES = [S1, S2, S3, S4, S5, S6, S7];
const GLOWS = ['#F43F5E', '#6366f1', '#FBBF24', '#34D399', '#22d3ee', '#f97316', '#f472b6'];

// ---------- lyrics ----------
function renderLine(t) {
  const si = sceneAt(t), L = LINES[si];
  const lineIn = prog(t, B[si], B[si] + .25);
  let h = '';
  for (const [w, s, e, k] of L.w) {
    const x = t - s, on = x >= 0, cur = on && t < e + .05;
    let size = 92, scale = 1, ty = 0, rot = 0, op, color = '#fff', shadow = '0 6px 24px rgba(0,0,0,.45)';
    if (k === 'dyn') size = 132; if (k === 'big') size = 168;
    if (!on) { op = .26; scale = k === 'in' ? .9 : 1; }
    else {
      op = cur ? 1 : .78;
      const from = k === 'big' ? .2 : k === 'dyn' ? .35 : k === 'acc' ? .55 : k === 'in' ? .6 : .82;
      scale = spring(x, from, 9, 18);
      if (cur && k) scale *= 1.06;
      if (k === 'in') ty = lerp(40, 0, easeOut(clamp(x / .2)));
      if ((k === 'dyn' || k === 'big' || k === 'acc') && x < .22) { rot = (hash(Math.round(t * 30) + s * 100) - .5) * 8; }
      if (cur) shadow = '0 0 28px rgba(110,220,255,.95), 0 0 70px rgba(110,220,255,.55), 0 6px 24px rgba(0,0,0,.4)';
      if (cur && (k === 'acc' || k === 'dyn')) { color = '#9ef0ff'; }
      if (k === 'big' && on) { color = '#ffe27a'; shadow = '0 0 36px rgba(255,200,80,.95), 0 0 90px rgba(255,120,160,.6), 0 6px 24px rgba(0,0,0,.4)'; }
    }
    h += `<span class="w" style="margin:0 ${k === 'dyn' || k === 'big' ? 46 : k === 'acc' ? 30 : 14}px;font-size:${size}px;opacity:${op * lineIn};color:${color};text-shadow:${shadow};transform:translateY(${ty + (1 - lineIn) * 30}px) scale(${scale}) rotate(${rot}deg)">${w}</span>`;
  }
  $('line').innerHTML = h;
}

// ---------- main ----------
function render(t) {
  const si = sceneAt(t), s0 = B[si], lt = t - s0;
  // background: dusk -> dawn
  const d = smooth(6.4, 13, t);
  $('bg').style.background = `linear-gradient(180deg, ${mixHex('0a0d26', '10234f', d)} 0%, ${mixHex('2a1b55', '1f6f86', d)} 48%, ${mixHex('4b1f4f', 'ff9a62', d)} 100%)`;
  for (let i = 0; i < 4; i++) { const st = $('st' + i); const y = 300 + i * 420 + Math.sin(t * .5 + i) * 40; const x = ((t * (40 + i * 25) + i * 300) % 1600) - 600;
    st.style.transform = `translate(${x}px,${y}px)`; st.style.opacity = .5 + .3 * Math.sin(t + i); }
  $('dust').innerHTML = DUST.map(p => { const y = ((p.y - t * p.v) % 1920 + 1920) % 1920; const x = p.x + Math.sin(t * .8 + p.ph) * 18;
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${p.s}" fill="rgba(255,255,255,${(p.a * (.6 + .4 * Math.sin(t * 2 + p.ph))).toFixed(2)})"/>`; }).join('');

  // card content
  const card = $('card');
  card.innerHTML = SCENES[si](t);
  $('glow').style.background = GLOWS[si]; $('glow').style.opacity = .55;

  // card motion: entry + 3D sway + exit
  let sc = 1, tx = 0, op = 1, flt = '';
  const tr = TR[si];
  if (si === 0) sc = spring(t, .85, 7, 12);
  else if (tr === 'pop') sc = spring(lt, .55, 9, 15);
  else if (tr === 'swipe') { tx = lerp(950, 0, easeOut(clamp(lt / .28))); tx += (lt < .4 ? (hash(Math.round(t * 30)) - .5) * 30 * (1 - lt / .4) : 0); }
  else sc = spring(lt, .82, 10, 16);
  const toEnd = B[si + 1] - t;
  if (toEnd < .1 && si < 6) { const e = 1 - toEnd / .1; sc *= lerp(1, .9, e); op = lerp(1, .6, e); }
  if (TR[si + 1] === 'swipe' && toEnd < .14) tx = lerp(0, -900, easeOut(1 - toEnd / .14));
  // glitch around glitch boundaries
  let g = 0;
  for (let i = 1; i < 7; i++) if (TR[i] === 'glitch') g = Math.max(g, 1 - Math.abs(t - B[i]) / .15);
  g = Math.max(0, g);
  if (g > 0) { const r = hash(Math.round(t * 30) + 7); tx += (r - .5) * 60 * g; const o = (16 * g).toFixed(1);
    flt = `drop-shadow(${o}px 0 0 rgba(255,0,90,.75)) drop-shadow(-${o}px 0 0 rgba(0,240,255,.75))`; }
  const rx = Math.sin(t * 1.3) * 3.2, ry = Math.cos(t * .9) * 4.5;
  const bob = Math.sin(t * 1.7) * 8;
  card.style.transform = `translate(${tx}px,${bob}px) rotateX(${rx}deg) rotateY(${ry}deg) scale(${sc})`;
  card.style.opacity = op; card.style.filter = flt;
  $('lyr').style.filter = flt; $('lyr').style.transform = g > 0 ? `translateX(${(hash(Math.round(t * 30) + 3) - .5) * 30 * g}px)` : '';
  $('scan').style.opacity = (g * .9 + .12).toFixed(2);

  // flash
  let fl = 0;
  for (let i = 1; i < 7; i++) fl = Math.max(fl, .28 * Math.max(0, 1 - Math.abs(t - B[i]) / .08));
  fl = Math.max(fl, .55 * Math.max(0, 1 - Math.abs(t - 6.2) / .12) * (t > 6.2 ? 1 : .3));
  fl = Math.max(fl, .7 * (t >= 12.45 ? Math.exp(-(t - 12.45) * 7) : 0));
  $('flash').style.opacity = fl.toFixed(3);
  $('fade').style.opacity = prog(t, 13.75, 14.12).toFixed(3);

  // stage zoom: slow drift + finale pullback
  const z = 1.09 + .025 * Math.sin(t * .6) + (t > 12.45 ? -.06 * easeOut(prog(t, 12.45, 13.6)) : 0) + (Math.abs(t - 8.2) < .3 ? .03 * (1 - Math.abs(t - 8.2) / .3) : 0);
  $('stage').style.transform = `scale(${z})`;

  // fx layer: floaters + burst
  let fx = '';
  for (const [t0, x0, type, dur] of FLOATERS) {
    const x = (t - t0) / dur; if (x < 0 || x > 1) continue;
    const y = lerp(1480, 700, easeOut(x)), xx = x0 + Math.sin(x * 9 + t0) * 22;
    const s = spring(t - t0, 0, 9, 14), o = x > .75 ? 1 - (x - .75) / .25 : 1;
    fx += `<g transform="translate(${xx},${y}) scale(${s}) rotate(${Math.sin(x * 6) * 12})" opacity="${o}">${floaterSvg(type)}</g>`;
  }
  if (t > 12.45) {
    const x = t - 12.45;
    for (const p of BURST) {
      const dist = p.v * (1 - Math.exp(-x * 2.4)) / 2.4 * 2.4 * .55;
      const bx = 480 + Math.cos(p.a) * dist, by = 1060 + Math.sin(p.a) * dist + 160 * x * x;
      const o = clamp(1.4 - x * .9);
      const shape = p.type === 'heart' ? heart(p.c, 1) : p.type === 'star' ? star(p.c, 1) : p.type === 'spark' ? spark(p.c, 1) : `<rect x="-10" y="-5" width="20" height="10" rx="3" fill="${p.c}"/>`;
      fx += `<g transform="translate(${bx},${by}) rotate(${p.rot * x}) scale(${p.s * clamp(x * 6)})" opacity="${o}">${shape}</g>`;
    }
  }
  $('fx').innerHTML = fx;

  renderLine(t);
}
window.render = render;
const q = new URLSearchParams(location.search);
render(parseFloat(q.get('t') || '1.2'));
</script>
</body>
</html>
