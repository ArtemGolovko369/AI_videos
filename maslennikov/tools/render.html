<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:#000;overflow:hidden}
svg{display:block}
</style></head>
<body>
<svg id="v" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Ролик «Здесь кто-нибудь есть?» — анимация всех сцен. frame(t) рисует кадр в момент t (сек).
const W=1920,H=1080;
const C={bg:'#070a12',bg2:'#0e1424',bg3:'#18223b',bg4:'#24314f',warm:'#ffd27a',warm2:'#ffad42',red:'#ff3b3b',
  ink:'#03050a',paper:'#efe6d2',dim:'#7c869c',snow:'#dfe7f5',gold:'#f2c14e',green:'#1f3b2e'};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>{t=clamp(t);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};
const eout=t=>{t=clamp(t);return 1-Math.pow(1-t,3)};
const ein=t=>{t=clamp(t);return t*t*t};
const back=t=>{t=clamp(t);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
function rng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
const F_SERIF="DejaVu Serif, serif", F_SANS="DejaVu Sans, sans-serif", F_MONO="DejaVu Sans Mono, monospace";
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

let TL=null, SC=null;   // таймлайн и текущая сцена
function at(word,n=1){   // момент (локальный, от начала сцены), когда звучит слово
  let k=0; const lw=word.toLowerCase().replace(/[«»]/g,'');
  for(const v of TL.voice){
    if(v.at<SC.start-0.01||v.at>SC.end) continue;
    for(const w of v.words){ if(w.w.toLowerCase().replace(/[«».,:?!—…]/g,'').startsWith(lw)){k++; if(k===n) return w.s-SC.start;} }
  }
  console.warn('no word',word); return 0;
}
function vEnd(){ // конец речи в сцене (локально)
  let e=0; for(const v of TL.voice) if(v.at>=SC.start-0.01&&v.at<=SC.end) e=Math.max(e,v.end-SC.start); return e;
}

// ---------- общие элементы
const DEFS=`<defs>
<linearGradient id="beamG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff3c4" stop-opacity=".95"/><stop offset=".55" stop-color="${C.warm}" stop-opacity=".35"/><stop offset="1" stop-color="${C.warm}" stop-opacity="0"/></linearGradient>
<radialGradient id="spotG"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".55" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="warmG"><stop offset="0" stop-color="${C.warm}" stop-opacity=".9"/><stop offset=".4" stop-color="${C.warm2}" stop-opacity=".35"/><stop offset="1" stop-color="${C.warm2}" stop-opacity="0"/></radialGradient>
<radialGradient id="redG"><stop offset="0" stop-color="${C.red}" stop-opacity="1"/><stop offset="1" stop-color="${C.red}" stop-opacity="0"/></radialGradient>
<radialGradient id="vig" cx="50%" cy="50%" r="72%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".7"/></radialGradient>
<linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050813"/><stop offset="1" stop-color="#1b2a4a"/></linearGradient>
<linearGradient id="fogG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb0cc" stop-opacity="0"/><stop offset="1" stop-color="#9fb0cc" stop-opacity=".45"/></linearGradient>
<linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a3"/><stop offset=".5" stop-color="${C.gold}"/><stop offset="1" stop-color="#b8862a"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur20" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
<filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".9"/></filter>
<pattern id="bricks" width="120" height="60" patternUnits="userSpaceOnUse"><rect width="120" height="60" fill="#3b3430"/><path d="M0,0H120M0,30H120M30,0V30M90,30V60" stroke="#221d1a" stroke-width="5"/></pattern>
</defs>`;

function T(x,y,txt,size,o={}){ // текст
  return `<text x="${x}" y="${y}" font-family="${o.f||F_SANS}" font-weight="${o.w||'bold'}" font-size="${size}" fill="${o.c||C.paper}" text-anchor="${o.a||'middle'}" ${o.ls?`letter-spacing="${o.ls}"`:''} ${o.op!=null?`opacity="${o.op}"`:''} ${o.extra||''}>${esc(txt)}</text>`;
}
function pop(lt,t0,dur=.35){return back(seg(lt,t0,t0+dur))}
function G(inner,{x=0,y=0,s=1,r=0,op=1,cx=0,cy=0}={}){ // группа с трансформацией вокруг (cx,cy)
  return `<g transform="translate(${x+cx},${y+cy}) rotate(${r}) scale(${s}) translate(${-cx},${-cy})" opacity="${clamp(op)}">${inner}</g>`;
}
function cam(inner,z,cx=W/2,cy=H/2,dx=0,dy=0){ // камера: зум вокруг точки
  return `<g transform="translate(${W/2+dx},${H/2+dy}) scale(${z}) translate(${-cx},${-cy})">${inner}</g>`;
}
function card(x,y,w,h,txt,size,o={}){ // плашка с текстом
  return `<g filter="url(#shadow)"><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${o.rx||14}" fill="${o.bg||C.paper}" stroke="${o.st||'none'}" stroke-width="4"/></g>`+
   T(x,y+size*.36,txt,size,{c:o.c||C.ink,f:o.f||F_SANS,ls:o.ls});
}
// силуэт человека; y — уровень ступней
function person(x,y,s=1,o={}){
  const f=o.fill||C.ink; let g='';
  if(o.hair) g+=`<path d="M-27,-176 Q-30,-212 0,-214 Q30,-212 27,-176 L34,-120 L-34,-120Z" fill="${f}"/>`;
  g+=`<circle cx="0" cy="-180" r="25" fill="${f}"/>`;
  if(o.hood) g+=`<path d="M-30,-182 Q-32,-215 0,-216 Q32,-215 30,-182 L30,-150 L-30,-150Z" fill="${f}"/>`;
  g+=`<path d="M-32,-148 Q0,-160 32,-148 L38,-62 L-38,-62Z" fill="${f}"/>`;
  if(o.skirt) g+=`<path d="M-38,-66 L38,-66 L50,-30 L-50,-30Z" fill="${f}"/>`;
  g+=`<path d="M-32,-66 L-28,0 L-9,0 L0,-52 L9,0 L28,0 L32,-66Z" fill="${f}"/>`;
  // левая рука вдоль тела
  if(!o.noLeft) g+=`<path d="M-30,-144 L-46,-70" stroke="${f}" stroke-width="15" stroke-linecap="round"/>`;
  // правая рука под углом (0 = вперёд-вправо горизонтально)
  const a=o.arm==null?70:o.arm;
  g+=`<g transform="translate(28,-140) rotate(${a})"><path d="M0,0 L74,0" stroke="${f}" stroke-width="15" stroke-linecap="round"/>`;
  if(o.torch) g+=`<rect x="64" y="-9" width="34" height="18" rx="4" fill="#2a2f3a"/><rect x="96" y="-12" width="8" height="24" rx="2" fill="${o.torchOn?C.warm:'#555'}"/>`;
  if(o.mic) g+=`<rect x="66" y="-5" width="30" height="10" rx="3" fill="#2a2f3a"/><circle cx="102" cy="0" r="11" fill="#3a404d"/>`;
  if(o.cam) g+=`<rect x="60" y="-22" width="56" height="38" rx="6" fill="#20242d"/><circle cx="118" cy="-3" r="12" fill="#3b4250"/><circle cx="70" cy="-14" r="5" fill="${C.red}"/>`;
  g+=`</g>`;
  if(o.rim) g=`<g filter="url(#glow)" opacity=".0"></g>`+g;
  return `<g transform="translate(${x},${y}) scale(${o.flip?-s:s},${s})">${g}</g>`;
}
// луч фонарика: начало (x,y), угол в градусах, длина, полуширина в конце
function beam(x,y,ang,len,half,op=1){
  return `<g transform="translate(${x},${y}) rotate(${ang})" opacity="${clamp(op)}"><path d="M0,-7 L${len},${-half} L${len},${half} L0,7Z" fill="url(#beamG)"/><circle r="16" fill="#fff3c4" filter="url(#glow)"/></g>`;
}
function stars(seed,n,y1=600,op=.8){const r=rng(seed);let s='';for(let i=0;i<n;i++){s+=`<circle cx="${r()*W}" cy="${r()*y1}" r="${.8+r()*1.8}" fill="#fff" opacity="${(.3+r()*.7)*op}"/>`}return s}
function snow(lt,seed,n=90,sp=60){const r=rng(seed);let s='';for(let i=0;i<n;i++){const x0=r()*W,y0=r()*H,v=sp*(.6+r()*.8),sz=1.5+r()*3.5;const y=(y0+lt*v)%(H+20)-10;const x=x0+Math.sin(lt*.8+i)*18;s+=`<circle cx="${x}" cy="${y}" r="${sz}" fill="${C.snow}" opacity="${.35+r()*.5}"/>`}return s}
function dust(lt,seed,n=40,cx=W/2,cy=H/2,rad=600){const r=rng(seed);let s='';for(let i=0;i<n;i++){const a=r()*6.28,d=r()*rad;const x=cx+Math.cos(a)*d+Math.sin(lt*.3+i)*30,y=cy+Math.sin(a)*d*.6-((lt*12+i*40)%200);s+=`<circle cx="${x}" cy="${y}" r="${1+r()*2.5}" fill="${C.warm}" opacity="${.15+r()*.35}"/>`}return s}
const VIG=`<rect width="${W}" height="${H}" fill="url(#vig)"/>`;
// маленький дом с окнами
function house(x,y,w,h,lit,seed,roof='#0c1222',wall='#141d33'){
  const r=rng(seed);let s=`<rect x="${x}" y="${y-h}" width="${w}" height="${h}" fill="${wall}"/><path d="M${x-12},${y-h} L${x+w/2},${y-h-w*.45} L${x+w+12},${y-h}Z" fill="${roof}"/>`;
  for(let wy=y-h+30;wy<y-40;wy+=60)for(let wx=x+20;wx<x+w-30;wx+=56){s+=`<rect x="${wx}" y="${wy}" width="26" height="32" fill="${r()<lit?'#f7c86a':'#0a0f1c'}"/>`}
  return s+`<path d="M${x-12},${y-h} L${x+w/2},${y-h-w*.45} L${x+w+12},${y-h}" stroke="${C.snow}" stroke-width="6" fill="none" opacity=".7"/>`;
}

// =============== СЦЕНЫ ===============
const S={};

// 1. Заставка: темнота, щелчок, луч выхватывает надпись на стене
S[1]=(lt,d)=>{
  const on=lt>0.9; const flick=on&&!(lt>1.0&&lt<1.08)&&!(lt>1.2&&lt<1.26);
  const sx=lerp(300,960,eio(seg(lt,1.1,2.6))), sy=lerp(820,470,eio(seg(lt,1.1,2.6)));
  const rad=on?lerp(120,520,eout(seg(lt,1.0,2.6))):0;
  let s=`<rect width="${W}" height="${H}" fill="#000"/>`;
  s+=`<defs><mask id="m1"><rect width="${W}" height="${H}" fill="#000"/>${flick?`<ellipse cx="${sx}" cy="${sy}" rx="${rad*1.5}" ry="${rad}" fill="url(#spotG)"/>`:''}</mask></defs>`;
  let wall=`<rect width="${W}" height="${H}" fill="url(#bricks)"/><rect width="${W}" height="${H}" fill="#000" opacity=".25"/>`;
  // нацарапанная надпись
  wall+=T(960,450,'ЗДЕСЬ КТО-НИБУДЬ',112,{f:F_SERIF,c:'#e9e1cf',extra:'transform="rotate(-3 960 450)" stroke="#b9ad96" stroke-width="2"'});
  wall+=T(960,590,'ЕСТЬ?',150,{f:F_SERIF,c:'#e9e1cf',extra:'transform="rotate(-2 960 590)" stroke="#b9ad96" stroke-width="2"'});
  const r=rng(11); for(let i=0;i<40;i++){const x=600+r()*720,y=360+r()*280;wall+=`<path d="M${x},${y} l${r()*30-15},${r()*12}" stroke="#d8cfbc" stroke-width="2" opacity=".5"/>`}
  s+=`<g mask="url(#m1)">${wall}</g>`;
  if(flick) s+=`<ellipse cx="${sx}" cy="${sy}" rx="${rad*1.6}" ry="${rad*1.1}" fill="${C.warm}" opacity=".08"/>`;
  // титр-подзаголовок
  s+=T(960,800,'ДОКУМЕНТАЛЬНАЯ ИСТОРИЯ',30,{c:C.dim,ls:10,op:seg(lt,2.4,3.2)*(1-seg(lt,d-.6,d))});
  return s+VIG;
};

// 2. Рождение: зимняя ночь, город в горах, наезд к окну, дата и метка
S[2]=(lt,d)=>{
  const z=lerp(1,2.6,eio(seg(lt,0,d*.85)));
  let w=`<rect width="${W}" height="${H}" fill="url(#nightSky)"/>${stars(3,120)}`;
  w+=`<circle cx="1500" cy="190" r="56" fill="#f4efe0" opacity=".9"/><circle cx="1500" cy="190" r="110" fill="#f4efe0" opacity=".08"/>`;
  w+=`<path d="M0,620 L220,380 L380,520 L560,300 L760,540 L960,340 L1180,560 L1380,360 L1600,520 L1760,400 L1920,560 V1080 H0Z" fill="#1b2744"/>`;
  w+=`<path d="M560,300 L610,360 L590,350 L560,380 L530,350 L510,360Z M960,340 L1010,400 L960,390 L920,400Z M1380,360 L1420,410 L1380,400 L1350,410Z" fill="${C.snow}" opacity=".8"/>`;
  w+=`<path d="M0,760 L300,560 L520,700 L760,600 L1000,720 L1260,590 L1520,700 L1920,620 V1080 H0Z" fill="#141e36"/>`;
  w+=`<rect y="880" width="${W}" height="200" fill="#dfe7f5" opacity=".9"/>`;
  const hs=[[60,880,180,200,.25],[280,880,150,150,.15],[460,880,220,260,.2],[720,880,160,170,.15],[1120,880,200,220,.1],[1360,880,170,180,.2],[1560,880,230,250,.2]];
  hs.forEach((h,i)=>w+=house(h[0],h[1],h[2],h[3],h[4],i+5));
  // главное окно
  w+=`<rect x="900" y="660" width="190" height="220" fill="#1a2440"/><path d="M888,660 L995,600 L1102,660Z" fill="#0c1222"/><path d="M888,660 L995,600 L1102,660" stroke="${C.snow}" stroke-width="6" fill="none"/>`;
  w+=`<rect x="965" y="720" width="60" height="74" fill="#ffd27a"/><rect x="965" y="720" width="60" height="74" fill="#ffd27a" filter="url(#glow)" opacity=".8"/><path d="M995,720 V794 M965,757 H1025" stroke="#5b4320" stroke-width="5"/>`;
  w+=`<circle cx="995" cy="757" r="120" fill="url(#warmG)" opacity=".5"/>`;
  let s=cam(w,z,995,757,0,lerp(0,40,seg(lt,0,d)));
  s+=snow(lt,7,110,70);
  // дата-календарь
  const p1=pop(lt,.5), out1=1-seg(lt,at('Небольшой')-.3,at('Небольшой')+.1);
  s+=G(`<rect x="-170" y="-120" width="340" height="240" rx="18" fill="${C.paper}"/><rect x="-170" y="-120" width="340" height="62" rx="18" fill="#c0392b"/><rect x="-170" y="-80" width="340" height="22" fill="#c0392b"/>`+
    T(0,-76,'ДЕКАБРЬ',30,{c:'#fff',ls:6})+T(0,58,'21.12.1994',54,{c:C.ink,f:F_SERIF}),{x:960,y:420,s:p1,op:out1});
  // метка на карте
  const t2=at('Небольшой')-.1, p2=pop(lt,t2), out2=1-seg(lt,at('Здесь')-.2,at('Здесь')+.2);
  s+=G(`<rect x="-330" y="-90" width="660" height="180" rx="16" fill="#0b1120" opacity=".85" stroke="${C.warm}" stroke-width="3"/>
    <path d="M-250,-40 a40,40 0 1 1 0.1,0 Z" fill="none"/><g transform="translate(-240,-6)"><path d="M0,40 C-30,0 -36,-10 -36,-26 a36,36 0 0 1 72,0 C36,-10 30,0 0,40Z" fill="${C.red}"/><circle cy="-26" r="13" fill="#fff"/></g>`+
    T(40,-8,'УСТЬ-КАТАВ',56,{c:C.paper,f:F_SERIF})+T(40,46,'Челябинская область',30,{c:C.dim,w:'normal'}),{x:960,y:420,s:p2,op:out2});
  // имя
  const p3=pop(lt,at('Его')), out3=1-seg(lt,d-.4,d);
  s+=G(`<rect x="-470" y="-90" width="940" height="140" rx="16" fill="#070a12" opacity=".75"/>`+T(0,0,'ДИМА МАСЛЕННИКОВ',84,{f:F_SERIF,c:C.paper,ls:4})+`<rect x="-300" y="26" width="600" height="4" fill="${C.warm}"/>`,{x:960,y:330,s:p3,op:out3});
  return s+VIG;
};

// 3. Семья и переезд
S[3]=(lt,d)=>{
  const tm=at('Вскоре')-.3; let s='';
  if(lt<tm+.6){
    let a=`<rect width="${W}" height="${H}" fill="${C.bg2}"/><ellipse cx="960" cy="900" rx="700" ry="80" fill="#000" opacity=".35"/>`;
    const p1=pop(lt,.2), p2=pop(lt,at('Мама'));
    // отец + атом
    let atom=''; for(let k=0;k<3;k++) atom+=`<ellipse rx="95" ry="32" fill="none" stroke="#7fd3ff" stroke-width="5" transform="rotate(${k*60+lt*70})"/>`;
    atom+=`<circle r="14" fill="#7fd3ff" filter="url(#glow)"/>`;
    for(let k=0;k<3;k++){const ang=lt*3+k*2.1,rot=(k*60+lt*70)*Math.PI/180;const ex=95*Math.cos(ang),ey=32*Math.sin(ang);a+='';atom+=`<circle cx="${ex*Math.cos(rot)-ey*Math.sin(rot)}" cy="${ex*Math.sin(rot)+ey*Math.cos(rot)}" r="8" fill="#fff"/>`}
    a+=G(person(0,0,1.6,{fill:'#000',arm:75})+G(atom,{x:0,y:-470})+T(0,120,'ОТЕЦ',40,{c:C.paper,ls:6})+T(0,170,'физик-ядерщик',32,{c:'#7fd3ff',w:'normal'}),{x:640,y:760,s:p1,cx:0,cy:-200});
    // мама + весы
    const tilt=Math.sin(lt*2.2)*8;
    let sc=`<rect x="-5" y="-100" width="10" height="140" fill="${C.gold}"/><rect x="-50" y="36" width="100" height="12" rx="6" fill="${C.gold}"/><g transform="rotate(${tilt})"><rect x="-120" y="-104" width="240" height="8" rx="4" fill="${C.gold}"/>`+
      `<g transform="translate(-110,-100) rotate(${-tilt})"><path d="M0,0 L-30,60 M0,0 L30,60" stroke="${C.gold}" stroke-width="3"/><path d="M-40,60 Q0,90 40,60Z" fill="${C.gold}"/></g>`+
      `<g transform="translate(110,-100) rotate(${-tilt})"><path d="M0,0 L-30,60 M0,0 L30,60" stroke="${C.gold}" stroke-width="3"/><path d="M-40,60 Q0,90 40,60Z" fill="${C.gold}"/></g></g><circle cy="-104" r="10" fill="${C.gold}"/>`;
    a+=G(person(0,0,1.6,{fill:'#000',hair:1,skirt:1,arm:80})+G(sc,{x:0,y:-450})+T(0,120,'МАМА',40,{c:C.paper,ls:6})+T(0,170,'юрист',32,{c:C.gold,w:'normal'}),{x:1280,y:760,s:p2,cx:0,cy:-200});
    s+=G(a,{op:1-seg(lt,tm,tm+.6)});
  }
  if(lt>tm){
    const k=seg(lt,tm,tm+.6); const pr=eio(seg(lt,tm+.5,d-.6));
    let m=`<rect width="${W}" height="${H}" fill="#0c1426"/>`;
    m+=`<path d="M120,330 C300,250 520,300 700,260 C900,220 1100,280 1300,240 C1500,210 1700,260 1820,300 L1840,760 C1600,820 1300,760 1100,800 C860,850 600,780 380,820 C260,840 160,800 100,760Z" fill="#17233f" stroke="#2c3d63" stroke-width="4"/>`;
    m+=`<path d="M1230,280 C1250,400 1210,520 1250,640 C1270,720 1240,780 1250,820" stroke="#2f3f63" stroke-width="22" fill="none" stroke-linecap="round"/>`+T(1300,330,'УРАЛ',26,{c:'#4e6390',ls:8,a:'start'});
    // путь
    const P0=[1320,560],P1=[1000,380],P2=[640,470];
    const bz=(t)=>[(1-t)**2*P0[0]+2*(1-t)*t*P1[0]+t*t*P2[0],(1-t)**2*P0[1]+2*(1-t)*t*P1[1]+t*t*P2[1]];
    let pts=[];for(let i=0;i<=60;i++){const t=i/60*pr;pts.push(bz(t))}
    m+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${C.warm}" stroke-width="6" stroke-dasharray="18 14"/>`;
    m+=`<circle cx="${P0[0]}" cy="${P0[1]}" r="14" fill="${C.red}"/>`+T(P0[0]+30,P0[1]+50,'Усть-Катав',34,{c:C.paper,a:'start',w:'normal'});
    m+=`<circle cx="${P2[0]}" cy="${P2[1]}" r="${10+6*seg(lt,d-1,d-.6)}" fill="${C.warm}" filter="url(#glow)"/>`+T(P2[0],P2[1]+60,'МОСКВА',40,{c:C.warm,f:F_SERIF,op:seg(lt,d-1.2,d-.7)});
    // поезд
    const p=bz(pr),q=bz(Math.max(0,pr-.01)); const ang=Math.atan2(p[1]-q[1],p[0]-q[0])*180/Math.PI;

S[15]=(lt,d)=>{
  const vs=TL.voice.filter(v=>v.at>=SC.start-.01);
  const e1=vs[0].end-SC.start, s2=vs[1].at-SC.start, e2=vs[1].end-SC.start;
  // коридор
  let s=`<rect width="${W}" height="${H}" fill="#04060b"/>`;
  s+=`<path d="M0,0 L760,380 L1160,380 L1920,0Z" fill="#090d16"/><path d="M0,1080 L760,700 L1160,700 L1920,1080Z" fill="#0b0f18"/><path d="M0,0 L760,380 L760,700 L0,1080Z" fill="#070a12"/><path d="M1920,0 L1160,380 L1160,700 L1920,1080Z" fill="#070a12"/><rect x="760" y="380" width="400" height="320" fill="#020306"/>`;
  for(let k=1;k<5;k++){const f=k/5;s+=`<path d="M${760*f},${380*f} V${1080-380*f}" stroke="#121827" stroke-width="${8*(1-f)+2}"/><path d="M${1920-760*f},${380*f} V${1080-380*f}" stroke="#121827" stroke-width="${8*(1-f)+2}"/>`}
  // луч поворачивается в сторону
  const tTurn0=.6,tTurn1=e1+.3;
  const ang=lerp(-6,20,eio(seg(lt,tTurn0+1.2,tTurn1)));
  const off=lt>e1+1.0; // фонарик гаснет
  const flick=lt>e1+.7&&lt<e1+1.0&&Math.sin(lt*80)>0;
  const gw=seg(lt,e1+.9,e1+1.8); // свет между силуэтами
  const fin=lt>e2+.6; const fade=seg(lt,d-1.6,d);
  if(!off&&!flick) s+=beam(830,690,ang,1300,240,.9);
  const she=seg(lt,tTurn1-.8,tTurn1+.2);
  if(!off&&!flick) s+=`<defs><mask id="m15"><rect width="${W}" height="${H}" fill="#000"/><g transform="translate(830,690) rotate(${ang})"><path d="M0,-7 L1300,-240 L1300,240 L0,7Z" fill="#fff"/></g></mask></defs>`;
  // второй силуэт: в луче подсвечен, потом тёплый контур
  const her=person(0,0,1.9,{fill:'#000',hair:1,arm:60,flip:1});
  s+=`<circle cx="1180" cy="760" r="${220+gw*120}" fill="url(#warmG)" opacity="${gw*.55}"/>`;
  s+=`<circle cx="980" cy="740" r="${200+gw*80}" fill="url(#warmG)" opacity="${gw*.5}"/>`;
  s+=G(her,{x:1380,y:1010,op:Math.max(she*.95,gw)});
  if(!off&&!flick) s+=`<g mask="url(#m15)">${G(person(0,0,1.9,{fill:'#5a4a33',hair:1,arm:60,flip:1}),{x:1380,y:1010,op:she})}</g>`;
  s+=person(760,1010,1.9,{fill:'#000',hood:1,arm:ang,torch:1,torchOn:!off&&!flick});
  // финальный титр
  if(fin) s+=G(T(0,0,'ЗДЕСЬ КТО-НИБУДЬ ЕСТЬ?',84,{f:F_SERIF,c:'#f4ecd8',ls:2}),{x:960,y:250,op:seg(lt,e2+.6,e2+1.4)});
  s+=`<rect width="${W}" height="${H}" fill="#000" opacity="${fade}"/>`;
  return s+VIG;
};

// =============== СУБТИТРЫ ===============
const ACC=/^(дима|масленников|гостбастер|клава|кока|москву|усть-катав|пятигорске|гоуска|эльзы|сашей|ютуба|ютуб|финансовый)/i;
const NUM=/^(двадцать|тысяча|девятьсот|девяносто|четвёртого|девятого|марта|две|тысячи|четырнадцатого|шестнадцатый|семнадцатом|второго|шестого|третьего|апреля|двадцати|двадцать|миллионов|трёх|миллиардов|десяти|золотой|медалью)/i;
let CHUNKS=[];
function buildChunks(){
  for(const v of TL.voice){
    let cur=[];
    const flush=()=>{if(cur.length)CHUNKS.push(cur);cur=[]};
    v.words.forEach((w,i)=>{cur.push(w); const end=/[.?!:…]$/.test(w.w)||/»$/.test(w.w)&&/[.?!]/.test(w.w); const nx=v.words[i+1];
      const len=cur.map(x=>x.w.length+1).reduce((a,b)=>a+b,0); if(end||len+(nx?nx.w.length:0)>40||(nx&&nx.w==='—')) flush(); if(w.w==='—'){cur.pop();}});
    flush();
  }
  CHUNKS=CHUNKS.map(c=>c.filter(w=>w.w!=='—')).filter(c=>c.length);
}
function subs(t){
  let s='';
  for(let i=0;i<CHUNKS.length;i++){
    const c=CHUNKS[i], st=c[0].s-.12, nx=CHUNKS[i+1], en=Math.min(c[c.length-1].e+.5, nx?nx[0].s-.12:1e9);
    if(t<st||t>en) continue;
    const op=seg(t,st,st+.12)*(1-seg(t,en-.12,en));
    let tsp=''; c.forEach(w=>{const lit=t>=w.s-.03; const word=w.w.toUpperCase(); const col=ACC.test(w.w.replace(/[«»]/g,''))?C.warm:(NUM.test(w.w)?'#ffe08a':'#ffffff');
      tsp+=`<tspan fill="${lit?col:'#9aa3b5'}" fill-opacity="${lit?1:.55}">${esc(word)} </tspan>`});
    s+=`<g opacity="${op}"><text x="960" y="1000" text-anchor="middle" font-family="${F_SANS}" font-weight="bold" font-size="46" stroke="#000" stroke-width="10" stroke-linejoin="round" paint-order="stroke" letter-spacing="1">${tsp}</text></g>`;
  }
  return s;
}

// =============== КАДР ===============
const XF=0.45; const CUT=new Set([8,9]); // в сцены 8 и 9 — жёсткая склейка
function drawScene(sc,T0){SC=sc;const lt=T0-sc.start,d=sc.end-sc.start;return S[sc.id](lt,d)}
function frame(t){
  let out=DEFS; const sc=TL.scenes; let i=sc.findIndex(s=>t>=s.start&&t<s.end); if(i<0)i=sc.length-1;
  const cur=sc[i];
  if(i>0&&t-cur.start<XF&&!CUT.has(cur.id)){out+=drawScene(sc[i-1],t)+`<g opacity="${eio((t-cur.start)/XF)}">${drawScene(cur,t)}</g>`}
  else out+=drawScene(cur,t);
  out+=subs(t);
  document.getElementById('v').innerHTML=out;
}
window.init=(tl)=>{TL=tl;buildChunks();};
</script></body></html>
