<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Было тяжело — росток</title>
<link rel="stylesheet" href="fonts/comf.css">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #333; }
  svg { position: absolute; left: 0; top: 0; }
  #lyr { position: absolute; left: 40px; width: 880px; top: 250px; height: 330px; display: flex; align-items: center; justify-content: center; text-align: center;
         font-family: 'Comfortaa', sans-serif; font-weight: 700; line-height: 1.2; }
  .w { display: inline-block; margin: 0 16px; white-space: nowrap; }
  #fade { position: absolute; inset: 0; background: #0d0f0c; opacity: 0; }
  #flash { position: absolute; inset: 0; background: #fff7dc; opacity: 0; }
</style>
</head>
<body>
<svg width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="skyStorm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d6470"/><stop offset="1" stop-color="#b9b6b0"/></linearGradient>
    <linearGradient id="skyDawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f9fe0"/><stop offset=".55" stop-color="#ffc98f"/><stop offset="1" stop-color="#ffe7c2"/></linearGradient>
    <linearGradient id="slabG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a7a7a3"/><stop offset=".12" stop-color="#8d8d89"/><stop offset="1" stop-color="#6c6c69"/></linearGradient>
    <linearGradient id="soilG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b4a33"/><stop offset="1" stop-color="#3b281c"/></linearGradient>
    <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3f9a3c"/><stop offset="1" stop-color="#8fd85a"/></linearGradient>
    <radialGradient id="glowY"><stop offset="0" stop-color="#fff3b0" stop-opacity=".95"/><stop offset="1" stop-color="#ffd36b" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".45"/></radialGradient>
    <filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence id="gt" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="2"/><feColorMatrix type="saturate" values="0"/></filter>
    <filter id="desat"><feColorMatrix id="sat" type="saturate" values="1"/></filter>
  </defs>
  <g id="world"></g>
  <rect width="1080" height="1920" filter="url(#grain)" opacity=".06"/>
  <rect width="1080" height="1920" fill="url(#vig)"/>
</svg>
<svg width="0" height="0"><path id="stemProbe" d="M0 0"/></svg>
<div id="scrim" style="position:absolute;left:0;right:0;top:120px;height:620px;background:radial-gradient(ellipse 70% 50% at 45% 50%, rgba(20,24,18,.42), rgba(20,24,18,0) 100%)"></div>
<div id="lyr"><div id="line"></div></div>
<div id="flash"></div>
<div id="fade"></div>

<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIn = x => x * x * x;
const easeIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const smooth = (a, b, t) => { const x = prog(t, a, b); return x * x * (3 - 2 * x); };
const spring = (x, from = 0, k = 9, w = 15) => x <= 0 ? from : 1 - (1 - from) * Math.exp(-k * x) * Math.cos(w * x);
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => rng(Math.floor(n) * 9973 + 17)();
const $ = id => document.getElementById(id);
window.ready = document.fonts.load('700 90px Comfortaa', 'Было тяжело').then(() => document.fonts.ready);

const LINES = [
  { w: [['Было', .48, .85], ['тяжело', .90, 2.20, 'acc']] },
  { w: [['Да', 2.24, 2.50], ['я', 2.55, 2.72], ['знаю', 2.75, 3.55, 'acc']] },
  { w: [['Было', 3.60, 3.92], ['не', 3.95, 4.12], ['легко', 4.15, 4.80, 'acc']] },
  { w: [['Понимаю', 4.83, 5.60], ['но', 5.70, 6.15], ['я', 6.20, 6.88, 'big']] },
  { w: [['Нашел', 6.92, 7.50], ['свой', 7.55, 8.15], ['путь', 8.20, 9.40, 'big']] },
  { w: [['Свою', 9.45, 9.95], ['дорогу', 10.00, 11.60, 'big']] },
  { w: [['Жизни', 11.65, 12.02], ['своей', 12.05, 12.40], ['суть', 12.45, 13.70, 'big']] },
];
const LB = [0, 2.16, 3.52, 4.75, 6.84, 9.37, 11.57, 99];

// ---------- world constants ----------
const GROUND = 2600, SLAB_TOP = 2380, SEED = [520, 2900];
const CRACK = [[540, 2600], [550, 2558], [534, 2500], [568, 2440], [556, 2380]];

// camera keys [t, cx, cy, zoom]
const CAM = [[0, 540, 2520, 1.0], [2.16, 540, 2540, 1.03], [2.55, 530, 2800, 1.55], [3.52, 530, 2770, 1.6], [3.95, 540, 2660, 1.32],
  [4.75, 540, 2630, 1.28], [6.2, 545, 2560, 1.12], [6.84, 545, 2470, 1.05], [8.3, 550, 2130, 1.0], [9.37, 550, 2060, 1.0],
  [11.57, 550, 1640, 1.0], [12.45, 552, 1470, 1.16], [14.2, 552, 1440, 1.08]];
function cam(t) {
  for (let i = 0; i < CAM.length - 1; i++) { const a = CAM[i], b = CAM[i + 1]; if (t <= b[0]) { const x = easeIO(prog(t, a[0], b[0])); return [lerp(a[1], b[1], x), lerp(a[2], b[2], x), lerp(a[3], b[3], x)]; } }
  const l = CAM[CAM.length - 1]; return [l[1], l[2], l[3]];
}

// ---------- stem ----------
function bendAt(t) {
  if (t < 4.0) return 0;
  if (t < 4.15) return lerp(0, 30, prog(t, 4.0, 4.15));
  if (t < 6.2) return 30 + 80 * spring(t - 4.15, 0, 6, 10) + 8 * Math.sin(t * 9) * prog(t, 4.6, 5);
  return lerp(110, 0, easeOut(prog(t, 6.2, 6.55)));
}
const stemD = b => `M${SEED[0]} ${SEED[1] - 10} Q${520 + b} 2770 532 2606 L550 2558 L534 2500 L568 2440 L556 2380 C 540 2250 620 2150 582 2030 S 500 1830 560 1710 S 600 1530 555 1420`;
function tipY(t) {
  if (t < 2.45) return SEED[1];
  if (t < 3.5) return lerp(2900, 2710, easeOut(prog(t, 2.45, 3.5)));
  if (t < 4.0) return lerp(2710, 2610, easeIn(prog(t, 3.5, 4.0)));
  if (t < 6.2) return 2610;
  if (t < 6.5) return lerp(2610, 2368, easeOut(prog(t, 6.2, 6.5)));
  if (t < 6.84) return lerp(2368, 2330, prog(t, 6.5, 6.84));
  if (t < 8.2) return lerp(2330, 2085, easeIO(prog(t, 6.84, 8.2)));
  if (t < 9.45) return lerp(2085, 2010, prog(t, 8.2, 9.45));
  if (t < 11.5) return lerp(2010, 1450, easeIO(prog(t, 9.45, 11.5)));
  return lerp(1450, 1422, easeOut(prog(t, 11.5, 12.4)));
}
let PROBE = null;
function stemGeom(t) {
  const p = $('stemProbe'); p.setAttribute('d', stemD(bendAt(t)));
  const L = p.getTotalLength(), N = 260, pts = [];
  for (let i = 0; i <= N; i++) { const q = p.getPointAtLength(L * i / N); pts.push([q.x, q.y, L * i / N]); }
  const lenAtY = y => { for (const q of pts) if (q[1] <= y + .5) return q[2]; return L; };
  return { p, L, pts, lenAtY };
}
function leaf(x, y, ang, s, flip = 1) {
  if (s <= 0.01) return '';
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${ang.toFixed(1)}) scale(${(s * flip).toFixed(3)} ${s.toFixed(3)})">
    <path d="M0 0 C 40 -46 120 -50 170 -8 C 120 30 40 26 0 0 Z" fill="url(#leafG)"/>
    <path d="M6 0 C 60 -10 110 -12 160 -8" stroke="#2f7a2e" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/></g>`;
}

// ---------- scene ----------
const RAIN = Array.from({ length: 90 }, (_, i) => { const r = rng(i + 10); return { x: r() * 1400 - 160, y: r() * 2000, v: 1500 + r() * 700, l: 40 + r() * 50 }; });
const PEBBLES = Array.from({ length: 70 }, (_, i) => { const r = rng(i + 300); return { x: r() * 1080, y: GROUND + 30 + r() * 820, rx: 6 + r() * 18, ry: 4 + r() * 12, c: ['#82603f', '#5a3f2b', '#9a7a5a', '#4a3324'][i % 4] }; });
const SPOTS = Array.from({ length: 50 }, (_, i) => { const r = rng(i + 500); return { x: 70 + r() * 940, y: SLAB_TOP + 20 + r() * 190, r: 2 + r() * 6 }; });
const DUST = Array.from({ length: 30 }, (_, i) => { const r = rng(i + 700); return { vx: (r() - .5) * 900, vy: -60 - r() * 260, r: 10 + r() * 30, side: r() < .5 ? 80 : 1000 }; });
const CHIPS = Array.from({ length: 16 }, (_, i) => { const r = rng(i + 800); return { vx: (r() - .5) * 600, vy: -300 - r() * 500, s: 6 + r() * 10, rot: r() * 360 }; });
const POLLEN = Array.from({ length: 40 }, (_, i) => { const r = rng(i + 900); return { a: r() * 6.28, v: 60 + r() * 140, s: 3 + r() * 5, d: r() * .5 }; });
const CLOUDS = Array.from({ length: 7 }, (_, i) => { const r = rng(i + 1000); return { x: r() * 1300 - 100, y: 600 + r() * 1700, w: 260 + r() * 300 }; });

function render(t) {
  const [ccx, ccy, z] = cam(t);
  const dawn = smooth(6.2, 12.6, t);
  let h = '';
  // ---- background (desaturated early) ----
  let bg = '';
  bg += `<rect x="-600" y="-400" width="2300" height="${GROUND + 400}" fill="url(#skyStorm)"/>`;
  bg += `<rect x="-600" y="-400" width="2300" height="${GROUND + 400}" fill="url(#skyDawn)" opacity="${dawn.toFixed(3)}"/>`;
  // sun
  if (dawn > 0) { const sy = lerp(1900, 1080, smooth(8, 14, t)); bg += `<circle cx="820" cy="${sy}" r="420" fill="url(#glowY)" opacity="${dawn}"/><circle cx="820" cy="${sy}" r="110" fill="#fff4c4" opacity="${dawn}"/>`; }
  // clouds
  for (const c of CLOUDS) { const x = c.x + t * 14; bg += `<g filter="url(#blur20)" opacity="${lerp(.55, .35, dawn)}"><ellipse cx="${x}" cy="${c.y}" rx="${c.w / 2}" ry="60" fill="${dawn > .5 ? '#fff6ea' : '#d8d6d2'}"/><ellipse cx="${x + c.w * .15}" cy="${c.y - 40}" rx="${c.w / 3}" ry="60" fill="${dawn > .5 ? '#fff6ea' : '#d8d6d2'}"/></g>`; }
  // soil
  bg += `<rect x="-600" y="${GROUND}" width="2300" height="1400" fill="url(#soilG)"/>`;
  bg += `<path d="M-600 ${GROUND + 260} Q 540 ${GROUND + 230} 1700 ${GROUND + 270}" stroke="#4e3524" stroke-width="40" fill="none" opacity=".5"/>`;
  for (const p of PEBBLES) bg += `<ellipse cx="${p.x}" cy="${p.y}" rx="${p.rx}" ry="${p.ry}" fill="${p.c}" opacity=".8"/>`;
  // ground surface edges + dead grass
  bg += `<rect x="-600" y="${GROUND - 6}" width="2300" height="14" fill="#7a5a3e"/>`;
  for (let i = 0; i < 14; i++) { const gx = i < 7 ? -10 + i * 10 : 1030 + (i - 7) * 10; bg += `<path d="M${gx} ${GROUND} q${4} -30 ${(i % 2 ? 10 : -6)} -46" stroke="#8d8466" stroke-width="5" fill="none"/>`; }
  h += `<g filter="url(#desat)">${bg}</g>`;

  // ---- seed + root ----
  let sp = '';
  const open = prog(t, 2.3, 2.5);
  sp += `<g transform="translate(${SEED[0]} ${SEED[1]})"><ellipse cx="${-12 * open}" cy="0" rx="26" ry="38" fill="#8a5a2e" transform="rotate(${-20 * open})"/><ellipse cx="${12 * open}" cy="0" rx="26" ry="38" fill="#a06a37" transform="rotate(${20 * open})"/></g>`;
  const rp = prog(t, 2.4, 3.4);
  if (rp > 0) sp += `<path d="M520 2915 C 515 3000 540 3060 520 3160 M522 3010 q-40 30 -70 90 M524 3070 q40 20 60 80" stroke="#efe2c4" stroke-width="7" fill="none" stroke-linecap="round" pathLength="1" stroke-dasharray="1.01 2" stroke-dashoffset="${1 - rp}"/>`;

  // ---- stem ----
  const G = stemGeom(t), ty = tipY(t), len = t < 2.45 ? 0 : G.lenAtY(ty);
  if (len > 0) {
    sp += `<path d="${stemD(bendAt(t))}" stroke="#3d8f37" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${len} 99999"/>`;
    sp += `<path d="${stemD(bendAt(t))}" stroke="#8fd85a" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="${len} 99999" transform="translate(-4 0)" opacity=".8"/>`;
    const tip = G.p.getPointAtLength(len), tip2 = G.p.getPointAtLength(Math.max(0, len - 8));
    const ang = Math.atan2(tip.y - tip2.y, tip.x - tip2.x) * 180 / Math.PI;
    // cotyledons at tip (until above slab), then fixed just above slab
    const cs = spring(t - 2.75, 0, 9, 14) * (t < 6.84 ? lerp(.45, .35, prog(t, 3.5, 4.2)) : .55);
    let cx0 = tip.x, cy0 = tip.y;
    if (t >= 6.5) { const q = G.p.getPointAtLength(G.lenAtY(2350)); cx0 = q.x; cy0 = q.y; }
    if (t > 2.75) sp += leaf(cx0, cy0, -150 + (t < 6.84 && t > 4.0 ? 40 : 0), cs, 1) + leaf(cx0, cy0, -30 - (t < 6.84 && t > 4.0 ? 40 : 0), cs, 1);
    sp += `<circle cx="${tip.x}" cy="${tip.y}" r="11" fill="#b9e87e"/>`;
    // leaves along stem
    const LEAVES = [[2120, 8.2, -160, 1], [2120, 8.25, -20, 1], [1900, 10.0, -165, .85], [1770, 10.4, -15, .85], [1640, 10.8, -160, .8], [1530, 11.2, -20, .75]];
    for (const [ly, lt, la, ls] of LEAVES) { if (t < lt || ty > ly + 10) continue; const q = G.p.getPointAtLength(G.lenAtY(ly));
      sp += leaf(q.x, q.y, la + Math.sin(t * 2 + ly) * 4, spring(t - lt, 0, 8, 13) * ls); }
    // bud / flower
    if (t > 11.6) {
      const fx = tip.x, fy = tip.y;
      const bud = easeOut(prog(t, 11.6, 12.35)), bloom = t >= 12.45 ? spring(t - 12.45, 0, 7, 11) : 0;
      if (bloom > 0) {
        sp += `<circle cx="${fx}" cy="${fy - 40}" r="${330 * clamp(bloom)}" fill="url(#glowY)" opacity=".8"/>`;
        // rays
        for (let k = 0; k < 12; k++) { const a = k * 30 + (t - 12.45) * 12; sp += `<path d="M${fx} ${fy - 40} l${Math.cos(a * Math.PI / 180) * 520 * clamp(bloom)} ${Math.sin(a * Math.PI / 180) * 520 * clamp(bloom)}" stroke="#fff3b0" stroke-width="${k % 2 ? 6 : 12}" opacity=".35" stroke-linecap="round"/>`; }
        for (let k = 0; k < 8; k++) { const a = k * 45 + 22; sp += `<g transform="translate(${fx} ${fy - 40}) rotate(${a}) scale(${bloom})"><path d="M0 0 C 40 -30 110 -40 150 0 C 110 40 40 30 0 0Z" fill="${k % 2 ? '#ff7f96' : '#ff9eb0'}"/><path d="M10 0 L120 0" stroke="#e45c78" stroke-width="3" opacity=".5"/></g>`; }
        sp += `<circle cx="${fx}" cy="${fy - 40}" r="${48 * bloom}" fill="#ffd23f"/><circle cx="${fx - 12}" cy="${fy - 52}" r="${14 * bloom}" fill="#fff1a0"/>`;
        for (const p of POLLEN) { const x = t - 12.55 - p.d; if (x <= 0) continue; const px = fx + Math.cos(p.a) * p.v * x * 2, py = fy - 40 + Math.sin(p.a) * p.v * x * 2 - 60 * x;
          sp += `<circle cx="${px}" cy="${py}" r="${p.s}" fill="#fff6c8" opacity="${clamp(1.2 - x * .7)}"/>`; }
      } else if (bud > 0) {
        sp += `<g transform="translate(${fx} ${fy}) scale(${bud})"><path d="M0 0 C -40 -30 -30 -90 0 -110 C 30 -90 40 -30 0 0Z" fill="#ff8fa3"/><path d="M0 0 C -30 -20 -34 -60 -14 -76 L0 -20 L14 -76 C 34 -60 30 -20 0 0Z" fill="#4fae46"/></g>`;
      }
    }
  }

  // ---- slab (drawn over stem under it) ----
  const fallX = prog(t, 0, .9), drop = t < .9 ? -900 * (1 - easeIn(fallX)) : -18 * Math.exp(-8 * (t - .9)) * Math.abs(Math.sin((t - .9) * 18));
  const split = t >= 6.2 ? easeOut(prog(t, 6.2, 6.5)) : 0;
  const crackW = split * 30 + (t > 5.7 && t < 6.2 ? 4 : 0);
  // left / right halves via clip paths along crack
  const cl = CRACK.map(p => `${p[0] - crackW / 2} ${p[1]}`).join(' L'), cr = CRACK.map(p => `${p[0] + crackW / 2} ${p[1]}`).join(' L');
  let slab = `<clipPath id="sl"><path d="M0 ${SLAB_TOP - 20} L${CRACK[4][0] - crackW / 2} ${SLAB_TOP - 20} L${cl.split(' L').reverse().join(' L')} L${CRACK[0][0] - crackW / 2} ${GROUND + 20} L0 ${GROUND + 20}Z"/></clipPath>
    <clipPath id="sr"><path d="M1080 ${SLAB_TOP - 20} L${CRACK[4][0] + crackW / 2} ${SLAB_TOP - 20} L${cr.split(' L').reverse().join(' L')} L${CRACK[0][0] + crackW / 2} ${GROUND + 20} L1080 ${GROUND + 20}Z"/></clipPath>`;
  const slabBody = `<rect x="60" y="${SLAB_TOP}" width="960" height="${GROUND - SLAB_TOP}" rx="10" fill="url(#slabG)"/>
    <rect x="60" y="${SLAB_TOP}" width="960" height="10" rx="5" fill="#c4c4bf"/>
    ${SPOTS.map(s => `<circle cx="${s.x}" cy="${s.y}" r="${s.r}" fill="#5f5f5c" opacity=".55"/>`).join('')}
    <rect x="150" y="${SLAB_TOP - 40}" width="14" height="44" rx="4" fill="#6b4a35"/><rect x="900" y="${SLAB_TOP - 30}" width="14" height="34" rx="4" fill="#6b4a35"/>`;
  slab += `<g clip-path="url(#sl)" transform="translate(${-14 * split} 0) rotate(${-1.2 * split} 60 ${GROUND})">${slabBody}</g>`;
  slab += `<g clip-path="url(#sr)" transform="translate(${14 * split} 0) rotate(${1.2 * split} 1020 ${GROUND})">${slabBody}</g>`;
  // hairline cracks
  const hc = prog(t, 4.9, 6.15);
  if (hc > 0 && t < 6.2) {
    const crackPath = `M${CRACK.map(p => p.join(' ')).join(' L')}`;
    const main = t < 5.7 ? hc * .45 : lerp(.45, .85, prog(t, 5.7, 6.0));
    slab += `<path d="${crackPath}" stroke="#2e2e2c" stroke-width="5" fill="none" pathLength="1" stroke-dasharray="1.01 2" stroke-dashoffset="${1 - main}"/>`;
    slab += `<path d="M540 2600 l-50 -40 l-30 -10 M548 2560 l60 -24 l40 6 M534 2500 l-70 -14" stroke="#3a3a37" stroke-width="3" fill="none" pathLength="1" stroke-dasharray="1.01 2" stroke-dashoffset="${1 - hc}"/>`;
  }
  // light leaking through crack
  if (t >= 6.2) { const g = 1 - prog(t, 6.6, 8); slab += `<ellipse cx="556" cy="${SLAB_TOP}" rx="${260 * easeOut(prog(t, 6.2, 6.4))}" ry="140" fill="url(#glowY)" opacity="${(.9 * g).toFixed(3)}"/>`;
    for (const c of CHIPS) { const x = t - 6.2; if (x > 1.2) continue; slab += `<rect x="${556 + c.vx * x}" y="${SLAB_TOP + c.vy * x + 1400 * x * x}" width="${c.s}" height="${c.s}" fill="#9a9a96" transform="rotate(${c.rot + x * 500} ${556 + c.vx * x} ${SLAB_TOP + c.vy * x + 1400 * x * x})"/>`; } }
  // dust on landing
  if (t > .9 && t < 2.2) { const x = t - .9; for (const d of DUST) { const px = d.side + d.vx * x * .6, py = GROUND - 10 + d.vy * x + 120 * x * x;
    slab += `<circle cx="${px}" cy="${py}" r="${d.r * (1 + x)}" fill="#b8b2a6" opacity="${clamp(.6 - x * .5)}" filter="url(#blur6)"/>`; } }

  h += sp;
  h += `<g filter="url(#desat)" transform="translate(0 ${drop.toFixed(1)})">${slab}</g>`;

  // rain
  const rainA = 1 - smooth(5.9, 6.6, t);
  if (rainA > 0) { let r = ''; const top = ccy - 960 / z - 100;
    for (const d of RAIN) { const y = top + ((d.y + t * d.v) % 2200), x = d.x + (ccx - 540) - ((t * d.v * .15) % 300); r += `<path d="M${x} ${y} l-10 ${d.l}" stroke="#d6dde6" stroke-width="3" opacity="${.45 * rainA}"/>`; }
    h += r; }

  // camera + shake
  let sh = 0; if (t > .9 && t < 1.25) sh = 18 * (1 - prog(t, .9, 1.25)); if (t > 6.2 && t < 6.45) sh = 14 * (1 - prog(t, 6.2, 6.45)); if (t > 4.15 && t < 4.35) sh = 6;
  const sx = sh ? (hash(t * 30) - .5) * sh : 0, sy = sh ? (hash(t * 30 + 5) - .5) * sh : 0;
  $('world').setAttribute('transform', `translate(${540 + sx} ${960 + sy}) scale(${z}) translate(${-ccx} ${-ccy})`);
  $('world').innerHTML = h;
  $('sat').setAttribute('values', lerp(.12, 1, smooth(6.15, 7.5, t)).toFixed(3));
  $('gt').setAttribute('seed', 1 + Math.floor(t * 15) % 30);

  let fl = 0;
  if (t >= 6.2) fl = Math.max(fl, .55 * Math.max(0, 1 - (t - 6.2) / .25));
  if (t >= 12.45) fl = Math.max(fl, .6 * Math.max(0, 1 - (t - 12.45) / .3));
  $('flash').style.opacity = fl.toFixed(3);
  $('fade').style.opacity = prog(t, 13.8, 14.12).toFixed(3);
  renderLine(t);
}

function renderLine(t) {
  let li = 0; for (let i = 0; i < 7; i++) if (t >= LB[i]) li = i;
  const lineIn = prog(t, LB[li], LB[li] + .25);
  let h = '';
  for (const [w, s, e, k] of LINES[li].w) {
    const x = t - s, on = x >= 0, cur = on && t < e + .05;
    const size = k === 'big' ? 128 : 96;
    let op = on ? (cur ? 1 : .85) : .3, ty = on ? lerp(26, 0, easeOut(clamp(x / .25))) : 10, sc = on && k ? spring(x, .8, 9, 14) : 1;
    let color = '#fbf7ee', glow = '0 4px 18px rgba(0,0,0,.6), 0 0 3px rgba(0,0,0,.7), 0 2px 2px rgba(0,0,0,.5)';
    if (cur) glow = '0 0 26px rgba(190,255,140,.6), 0 4px 18px rgba(0,0,0,.6), 0 0 3px rgba(0,0,0,.7)';
    if (cur && k) color = '#c9f59a';
    h += `<span class="w" style="font-size:${size}px;opacity:${(op * lineIn).toFixed(3)};color:${color};text-shadow:${glow};transform:translateY(${ty.toFixed(1)}px) scale(${sc.toFixed(3)})">${w}</span>`;
  }
  $('line').innerHTML = h;
}
window.render = render;
window.ready.then(() => render(parseFloat(new URLSearchParams(location.search).get('t') || '1.5')));
</script>
